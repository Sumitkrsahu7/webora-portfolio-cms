server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 7MB

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: portfolio-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=PortfolioCMS;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: PortfolioHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    frontend-origin: ${PORTFOLIO_FRONTEND_ORIGIN:http://localhost:5173}
    admin-origin: ${PORTFOLIO_ADMIN_ORIGIN:http://localhost:4200}

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000

  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  upload:
    provider: ${APP_UPLOAD_PROVIDER:local}
    dir: ${APP_UPLOAD_DIR:uploads}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
